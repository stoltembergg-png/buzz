name: Hermes macOS Preview Release

on:
  push:
    tags:
      - "hermes-v[0-9]*"

permissions:
  contents: write

concurrency:
  group: hermes-macos-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build and publish macOS Intel preview
    runs-on: macos-13
    timeout-minutes: 60
    env:
      MACOSX_DEPLOYMENT_TARGET: "10.15"
      CMAKE_OSX_DEPLOYMENT_TARGET: "10.15"
      TAURI_BUNDLER_DMG_IGNORE_CI: "true"
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Activate repository toolchain
        uses: cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616 # v1

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.4.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Derive release version
        id: metadata
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#hermes-v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid Hermes preview version: $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Patch desktop version for the build
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          cd desktop
          node scripts/set-version-from-tag.mjs "$VERSION"

      - name: Build Buzz sidecars
        run: |
          cargo build --release \
            -p buzz-acp \
            -p buzz-agent \
            -p buzz-dev-mcp \
            -p git-credential-nostr \
            -p buzz-cli
          ./scripts/bundle-sidecars.sh

      - name: Build unsigned Tauri bundle
        run: cd desktop && pnpm tauri build --verbose --no-sign

      - name: Stage macOS artifacts
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          BUNDLE_DIR="desktop/src-tauri/target/release/bundle"
          DMG=$(find "$BUNDLE_DIR/dmg" -name '*.dmg' -type f | head -1)
          APP="$BUNDLE_DIR/macos/Buzz.app"
          if [[ -z "$DMG" || ! -d "$APP" ]]; then
            echo "::error::Tauri did not produce both a DMG and Buzz.app"
            exit 1
          fi
          cp "$DMG" "release-artifacts/Buzz_${VERSION}_x86_64.dmg"
          ditto -c -k --sequesterRsrc --keepParent \
            "$APP" "release-artifacts/Buzz_${VERSION}_x86_64.app.zip"
          (cd release-artifacts && shasum -a 256 *.dmg *.zip > SHA256SUMS)

      - name: Extract changelog section
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          set -euo pipefail
          awk -v version="$VERSION" '
            $0 ~ "^## \\[" version "\\]" { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          test -s "$RUNNER_TEMP/release-notes.md"

      - name: Publish GitHub prerelease
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Buzz $VERSION — Hermes macOS preview" \
            --prerelease \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            release-artifacts/Buzz_${VERSION}_x86_64.dmg \
            release-artifacts/Buzz_${VERSION}_x86_64.app.zip \
            release-artifacts/SHA256SUMS
