name: DCO Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  dco:
    name: DCO (Signed-off-by)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: DCO Check
        uses: ProtonMail/go-dco@v1
        with:
          # Only check DCO on pull request events; pushes are direct commits
          # and use signed commits locally.
          base: ${{ github.event_name == 'pull_request' && github.base_ref || '' }}
