name: Periodic Report

on:
  schedule:
    # A cada 5 dias, 09:00 UTC (06:00 BRT)
    # GitHub cron não suporta "every 5 days" nativo — esta pattern
    # dispara nos dias 1, 6, 11, 16, 21, 26, 31 de cada mês (~5 em 5 dias).
    - cron: '0 9 1,6,11,16,21,26,31 * *'
  workflow_dispatch:
    inputs:
      force_new_issue:
        description: 'Force a new issue even if a related one is open'
        required: false
        default: 'false'

permissions:
  issues: write
  contents: read
  pull-requests: read
  actions: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Collect repo state
        id: collect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TODAY=$(date -u +%Y-%m-%d)
          YESTERDAY=$(date -u -d 'yesterday' +%Y-%m-%d)

          # Merged PRs in the last 24h (|| true to tolerate empty results)
          MERGED=$(gh pr list --state merged --limit 50 \
            --json number,title,mergedAt,labels,headRefName \
            --jq '.[] | select(.mergedAt >= "'$YESTERDAY'T00:00:00Z") | "- #\(.number) \(.title) [\(.headRefName)]"' || true)
          MERGED="${MERGED:-_None_}"

          # Open draft PRs (roadmap)
          OPEN_DRAFTS=$(gh pr list --state open --draft --limit 50 \
            --json number,title,headRefName \
            --jq '.[] | "- #\(.number) \(.title) [\(.headRefName)]"' || true)
          OPEN_DRAFTS="${OPEN_DRAFTS:-_None_}"

          # Open PRs ready for review (non-draft: filter via --search)
          OPEN_READY=$(gh pr list --state open --search 'draft:false' --limit 20 \
            --json number,title,headRefName \
            --jq '.[] | "- #\(.number) \(.title) [\(.headRefName)]"' || true)
          OPEN_READY="${OPEN_READY:-_None_}"

          # CI check results from the last 24h
          FAILED_CHECKS=$(gh run list --limit 30 --json databaseId,name,status,conclusion,createdAt \
            --jq '.[] | select(.createdAt >= "'$YESTERDAY'T00:00:00Z" and .conclusion == "failure") | "- \(.name) (run \(.databaseId)): \(.conclusion)"' || true)
          FAILED_CHECKS="${FAILED_CHECKS:-_None_}"

          # Commits in the last 24h (|| true to tolerate empty days)
          COMMITS=$(git log --since="$YESTERDAY 00:00:00" --until="$TODAY 23:59:59" --oneline --no-merges 2>/dev/null | head -30 || true)
          COMMITS="${COMMITS:-_None_}"

          # Rust source files and line counts (project structure)
          RUST_FILES=$(find desktop/src-tauri/src crates -name '*.rs' -not -path '*/target/*' 2>/dev/null | wc -l || echo "0")
          RUST_LINES=$(find desktop/src-tauri/src crates -name '*.rs' -not -path '*/target/*' -exec cat {} + 2>/dev/null | wc -l || echo "0")

          # Rust test count
          RUST_TESTS=$(grep -r '#\[test\]' desktop/src-tauri/src crates --include='*.rs' -l 2>/dev/null | wc -l || echo "0")

          # Spec features implemented
          SPEC_FEATURES=$(ls -d .spec/features/*/ 2>/dev/null | wc -l || echo "0")
          SPEC_EVIDENCE=$(ls .spec/verification/*.json 2>/dev/null | wc -l || echo "0")

          # Spec verification files (recent)
          VERIFY_FILES=$(ls -la .spec/verification/*.json 2>/dev/null | tail -10 || echo "_None_")

          # Roadmap spec docs
          ROADMAP_PRS=$(ls docs/roadmap/prs/PR-*.md 2>/dev/null | wc -l || echo "0")

          # Recent issues
          OPEN_ISSUES=$(gh issue list --state open --limit 20 \
            --json number,title,labels \
            --jq '.[] | "- #\(.number) \(.title) [\([.labels[].name] | join(", "))]"' || true)
          OPEN_ISSUES="${OPEN_ISSUES:-_None_}"

          # Latest release
          LATEST_RELEASE=$(gh release list --limit 3 \
            --json tagName,name,isDraft,publishedAt \
            --jq '.[] | "- \(.name) (\(.tagName)) draft=\(.isDraft) \(.publishedAt)"' || true)
          LATEST_RELEASE="${LATEST_RELEASE:-_None_}"

          # Recent test/verify results
          VERIFY_FILES=$(ls -la .spec/verification/*.json 2>/dev/null | tail -10 || echo "_None_")

          # Write to GITHUB_ENV and output files
          {
            echo "REPORT_DATE=$TODAY"
            echo "MERGED_PRS<<MERGED_EOF"
            echo "$MERGED"
            echo "MERGED_EOF"
            echo "OPEN_DRAFTS<<DRAFTS_EOF"
            echo "$OPEN_DRAFTS"
            echo "DRAFTS_EOF"
            echo "COMMITS<<COMMITS_EOF"
            echo "$COMMITS"
            echo "COMMITS_EOF"
            echo "OPEN_ISSUES<<ISSUES_EOF"
            echo "$OPEN_ISSUES"
            echo "ISSUES_EOF"
            echo "LATEST_RELEASE<<RELEASE_EOF"
            echo "$LATEST_RELEASE"
            echo "RELEASE_EOF"
            echo "RUST_FILES=$RUST_FILES"
            echo "RUST_LINES=$RUST_LINES"
            echo "RUST_TESTS=$RUST_TESTS"
            echo "SPEC_FEATURES=$SPEC_FEATURES"
            echo "SPEC_EVIDENCE=$SPEC_EVIDENCE"
            echo "ROADMAP_PRS=$ROADMAP_PRS"
            echo "VERIFY_FILES<<VERIFY_EOF"
            echo "$VERIFY_FILES"
            echo "VERIFY_EOF"
          } >> "$GITHUB_ENV"

      - name: Generate report
        id: mimo
        env:
          XIAOMI_MIMO_API_KEY: ${{ secrets.XIAOMI_MIMO_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Build the context prompt
          PROMPT=$(cat <<'PROMPT_EOF'
          Você é um engenheiro de desenvolvimento sênior analisando o estado de um projeto de software (fork do Buzz/Hermes — app desktop Tauri+Rust+React com agentes AI via Nostr).
          Foque no PROJETO: código, arquitetura, correções, melhorias e progresso do roadmap.
          NÃO foque em CI/CD, workflows do GitHub, checks de Actions, ou status de PRs como métrica principal.
          Gere um relatório estruturado em markdown com as seguintes seções:

          ## Resumo
          - Progresso do projeto desde a última análise
          - Módulos implementados e estado geral do código

          ## Pontos Fortes
          - O que está bem arquitetado ou implementado

          ## Problemas no Projeto
          - Bugs potenciais, code smells, débito técnico
          - Módulos faltantes ou incompletos
          - Riscos arquiteturais

          ## Correcoes e Melhorias Sugeridas
          - Para cada item, descreva:
            - O que: problema ou melhoria específica no código/projeto
            - Como corrigir: passo a passo técnico (arquivos, funções, abordagem)
            - Prioridade: alta/média/baixa
            - Espec referenciada: REQ/AC do roadmap se aplicável
          - Sugira as próximas 2-3 PRs do roadmap que deveriam ser implementadas, com justificativa técnica

          ## Labels Sugeridas
          - 1-3 labels sobre o tema do relatório (ex: memory, providers, skills, plugins, architecture)

          ## Roadmap
          - Requisitos em risco (dependências bloqueadas, prazos)
          - Requisitos que progrediram desde a última análise

          Dados do repositório:
          PROMPT_EOF
          )

          # Append collected data to the prompt
          CONTEXT=""

          CONTEXT+="### Estrutura do Projeto
          - Arquivos Rust: $RUST_FILES
          - Linhas de código Rust: $RUST_LINES
          - Arquivos com testes Rust: $RUST_TESTS
          - Features de spec implementadas: $SPEC_FEATURES
          - Evidências de verificação: $SPEC_EVIDENCE
          - PRs de roadmap documentadas: $ROADMAP_PRS

          ### Commits Recentes
          $COMMITS

          ### PRs Mergeadas (últimas 24h)
          $MERGED_PRS

          ### Issues Abertas
          $OPEN_ISSUES

          ### Releases Recentes
          $LATEST_RELEASE

          ### Evidências de Verificação (specs)
          $VERIFY_FILES

          ### Data do Relatório
          $REPORT_DATE

          ### Roadmap de Referência
          O projeto segue um roadmap em docs/roadmap/hermes-buzz-delivery-roadmap.md com 46 PRs planejadas (PR-001 a PR-046).
          Cada PR tem REQ-XXX-NNN (requisitos) e AC-XXX-NNN (critérios de aceitação).
          As PRs implementadas passam por verify-feature.sh que valida spec, test e evidence.
          Já implementadas: PR-001 (roadmap), PR-002 (templates), PR-003 (verificador), PR-004 (RuntimeScopeContext), PR-005 (HermesMemoryScope), PR-006 (profile bootstrap), PR-007 (HERMES_HOME injection), PR-008 (persistence harness).
          Próxima: PR-009 (provider capability contract).
          Fases: Memory (completa), Providers (PR-009..014), Context Compression (PR-015..018), Skills (PR-019..022), MCP (PR-023..027), Plugins (PR-028..032), Observability (PR-033..036), Self-Improvement (PR-037..041), Credentials (PR-042..044), Release (PR-045..046).
          "

          # Call Xiaomi MiMo API (v2.5)
          # MiMo is a reasoning model: it producess reasoning_content BEFORE content.
          # Need high max_tokens (8192) so reasoning finishes and content is non-empty.
          # Correct endpoint: https://api.xiaomimimo.com/v1/chat/completions
          RESPONSE=$(curl -sS --max-time 180 \
            -X POST \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $XIAOMI_MIMO_API_KEY" \
            -d "$(jq -n --arg prompt "$PROMPT$CONTEXT" \
              '{
                model: "mimo-v2.5",
                messages: [
                  {role: "system", content: "Você é um engenheiro de desenvolvimento sênior que gera relatórios técnico-gerenciais em português do Brasil. Seja conciso, específico e actionável. Evite generalidades — cite números de PR, nomes de arquivos e IDs de REQ/AC quando relevante. Pulle o raciocínio curto e foque na resposta final."},
                  {role: "user", content: $prompt}
                ],
                temperature: 0.3,
                max_tokens: 8192
              }')" \
            "https://api.xiaomimimo.com/v1/chat/completions")

          # Extract the report content (MiMo puts final answer in .content, reasoning in .reasoning_content)
          REPORT_CONTENT=$(echo "$RESPONSE" | jq -r '.choices[0].message.content // empty')

          if [ -z "$REPORT_CONTENT" ] || [ "$REPORT_CONTENT" = "null" ]; then
            echo "::error::MiMo API returned empty content. The reasoning model may have exhausted the token budget before producing final answer."
            # Save full response for debugging (reasoning_content shows what happened)
            echo "$RESPONSE" > mimo_error.json
            # Try to salvage reasoning_content as fallback report
            REASONING=$(echo "$RESPONSE" | jq -r '.choices[0].message.reasoning_content // empty')
            if [ -n "$REASONING" ]; then
              echo "::warning::Content was empty but reasoning_content has $${#REASONING} chars. Using as fallback."
              REPORT_CONTENT="> ⚠️ Relatório gerado a partir do reasoning_content (max_tokens insuficiente para content completo).\n\n$REASONING"
            else
              exit 1
            fi
          fi

          # Extract suggested labels from the report
          LABELS=$(echo "$REPORT_CONTENT" | sed -n '/## Labels Sugeridas/,/## /p' | tail -n +2 | head -10 | grep -oE '\b[a-z-]+\b' | head -3 | sort -u | tr '\n' ',' | sed 's/,$//')

          # Save to outputs
          echo "report<<REPORT_EOF" >> "$GITHUB_OUTPUT"
          echo "$REPORT_CONTENT" >> "$GITHUB_OUTPUT"
          echo "REPORT_EOF" >> "$GITHUB_OUTPUT"

          echo "labels=$LABELS" >> "$GITHUB_OUTPUT"

          # Also save to file for debugging
          echo "$REPORT_CONTENT" > mimo_report.md

      - name: Find related open issue (same theme)
        id: related
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Extract the primary theme from the report (first label or section heading)
          THEME=$(echo "${{ steps.mimo.outputs.labels }}" | cut -d, -f1)

          if [ -z "$THEME" ]; then
            echo "related_issue=" >> "$GITHUB_OUTPUT"
            echo "theme=general" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "theme=$THEME" >> "$GITHUB_OUTPUT"

          # Search open issues with the same label, created in the last 7 days
          RELATED=$(gh issue list --state open --label "$THEME" --limit 5 \
            --json number,createdAt,title \
            --jq '.[] | select(.createdAt >= "'$(date -u -d '7 days ago' +%Y-%m-%d)'T00:00:00Z") | .number' \
            | tail -1)  # latest matching issue

          if [ -n "$RELATED" ] && [ "${{ github.event.inputs.force_new_issue }}" != "true" ]; then
            echo "related_issue=$RELATED" >> "$GITHUB_OUTPUT"
            echo "Found related issue #$RELATED with label '$THEME'"
          else
            echo "related_issue=" >> "$GITHUB_OUTPUT"
            echo "No related issue found — will create new one"
          fi

      - name: Publish report (new issue or comment)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPORT: ${{ steps.mimo.outputs.report }}
          LABELS: ${{ steps.mimo.outputs.labels }}
          RELATED_ISSUE: ${{ steps.related.outputs.related_issue }}
          THEME: ${{ steps.related.outputs.theme }}
        run: |
          set -euo pipefail

          # Ensure all suggested labels exist
          IFS=',' read -ra LABEL_ARRAY <<< "$LABELS"
          for label in "${LABEL_ARRAY[@]}"; do
            label=$(echo "$label" | xargs)  # trim
            if [ -n "$label" ]; then
              gh label create "$label" --color "5319e7" --force 2>/dev/null || true
            fi
          done

          # Add standard labels
          LABELS_WITH_STANDARD="$LABELS,report,periodic"
          # Ensure report label exists
          gh label create "report" --color "0e8a16" --force 2>/dev/null || true
          gh label create "periodic" --color "fbca04" --force 2>/dev/null || true

          if [ -n "$RELATED_ISSUE" ]; then
            # Comment on existing issue (same theme — continue thread)
            gh issue comment "$RELATED_ISSUE" --body "Atualização $REPORT_DATE

          $REPORT

          ---
          _Atualização do relatório periódico — mesma temática da issue original ($THEME)_
          "

            echo "Commented on issue #$RELATED_ISSUE"

          else
            # Create new issue — title is just "Report - YYYY-MM-DD"
            TITLE="Report - $REPORT_DATE"

            gh issue create \
              --title "$TITLE" \
              --label "$LABELS_WITH_STANDARD" \
              --body "$REPORT

          ---
          _Relatório gerado automaticamente via workflow GitHub Actions._"

            echo "Created new issue"
          fi

      - name: Apply labels to open PRs (auto-label)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Auto-label open PRs based on branch name pattern
          # roadmap/pr-NNN-* → label based on phase
          gh pr list --state open --limit 50 --json number,headRefName --jq '.[] | "\(.number) \(.headRefName)"' | while read num branch; do
            PHASE=""
            case "$branch" in
              roadmap/pr-00[1-8]*|feature/pr-00[1-8]*) PHASE="memory" ;;
              roadmap/pr-009-*|roadmap/pr-01[0-4]*) PHASE="providers" ;;
              roadmap/pr-01[5-8]*) PHASE="context-compression" ;;
              roadmap/pr-01[9-2]*) PHASE="skills" ;;
              roadmap/pr-02[3-7]*) PHASE="mcp" ;;
              roadmap/pr-02[8-2]*) PHASE="plugins" ;;
              roadmap/pr-03[3-6]*) PHASE="observability" ;;
              roadmap/pr-03[7-1]*) PHASE="self-improvement" ;;
              roadmap/pr-04[2-4]*) PHASE="credentials" ;;
              roadmap/pr-045-*|roadmap/pr-046*) PHASE="release" ;;
              *) PHASE="roadmap" ;;
            esac

            if [ -n "$PHASE" ]; then
              gh label create "$PHASE" --color "1d76db" --force 2>/dev/null || true
              gh label create "roadmap" --color "cccccc" --force 2>/dev/null || true
              gh pr edit "$num" --add-label "$PHASE,roadmap" 2>/dev/null || true
            fi
          done

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: mimo-report-${{ env.REPORT_DATE }}
          path: mimo_report.md
          retention-days: 30
