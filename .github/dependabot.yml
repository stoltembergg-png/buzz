version: 2
updates:
  # GitHub Actions — update action versions weekly
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["ci", "dependencies"]
    commit-message:
      prefix: "ci"

  # Rust (Cargo) — workspace root
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "rust"]
    commit-message:
      prefix: "deps"
    open-pull-requests-limit: 5
    reviewers: []

  # npm/pnpm — desktop frontend
  - package-ecosystem: "npm"
    directory: "/desktop"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "desktop"]
    commit-message:
      prefix: "deps"
    open-pull-requests-limit: 5

  # npm/pnpm — workspace root
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies"]
    commit-message:
      prefix: "deps"
    open-pull-requests-limit: 3

  # Docker — Dockerfiles
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "docker"]
    commit-message:
      prefix: "deps"
