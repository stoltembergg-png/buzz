# Configuration for actions/labeler@v5
# Labels PRs based on changed file paths.

rust:
  - changed-files:
      - any-glob-to-any-file: "crates/**"

desktop:
  - changed-files:
      - any-glob-to-any-file: "desktop/**"

mobile:
  - changed-files:
      - any-glob-to-any-file: "mobile/**"

web:
  - changed-files:
      - any-glob-to-any-file: "web/**"

migrations:
  - changed-files:
      - any-glob-to-any-file: "migrations/**"

ci:
  - changed-files:
      - any-glob-to-any-file: ".github/**"

documentation:
  - changed-files:
      - any-glob-to-any-file:
          - "docs/**"
          - "*.md"
          - "CHANGELOG.md"

docker:
  - changed-files:
      - any-glob-to-any-file:
          - "Dockerfile*"
          - "docker-compose*.yml"

dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - "Cargo.lock"
          - "pnpm-lock.yaml"
          - "Cargo.toml"
          - "package.json"
